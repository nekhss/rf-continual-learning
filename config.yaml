# =============================================================================
# config.yaml  (shared file)
#
# Person 2 owns ONLY the model/training-related keys below.
# Do not add data-pipeline or evaluation keys here without agreeing with the
# other developers first (this file is shared).
# =============================================================================

# ---- Reproducibility --------------------------------------------------------
seed: 42

# ---- Problem definition -----------------------------------------------------
# RadioML 2016.10a has 11 modulation classes. The classifier depends on x only.
num_classes: 11

# ---- Model (RFClassifier) ---------------------------------------------------
model:
  in_channels: 2
  conv_channels: [64, 64, 128]
  kernel_size: 3
  pool_size: 2
  fc_hidden: 128
  dropout: 0.3

# ---- Training ---------------------------------------------------------------
training:
  batch_size: 128
  epochs: 50
  optimizer: adam           # adam | adamw | sgd
  learning_rate: 0.001
  weight_decay: 0.0
  momentum: 0.9             # used only when optimizer == sgd
  early_stopping_patience: 10   # epochs with no val improvement before stopping; <=0 disables
  grad_clip_norm: 0.0       # max grad norm; 0 disables clipping
  num_workers: 0            # DataLoader workers (0 -> deterministic, no worker seeding needed)
  optimizer: adam
  momentum: 0.9
  early_stopping_patience: 3
  grad_clip_norm: 0.0
  num_workers: 0
  output_dir: results

# ---- Experiment I/O ---------------------------------------------------------
output_dir: results
