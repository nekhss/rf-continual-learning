seed: 42

dataset:
  name: RadioML2016.10a
  num_classes: 11
  input_length: 128

split:
  train: 0.70
  validation: 0.15
  test: 0.15

tasks:
  task_1:
    snr: [12, 14, 16, 18]

  task_2:
    snr: [4, 6, 8, 10]

  task_3:
    snr: [-4, -2, 0, 2]

  task_4:
    snr: [-12, -10, -8, -6]

  task_5:
    snr: [-20, -18, -16, -14]

training:
  batch_size: 128
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001

replay:
  memory_size: 2000
  methods:
    - random
    - snr_aware

evaluation:
  num_classes: 11
  compute_macro_f1: true
  compute_per_class_accuracy: true
  compute_confusion_matrix: true
  compute_average_accuracy: true
  compute_average_forgetting: true
